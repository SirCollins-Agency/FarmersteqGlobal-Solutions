name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.0.2)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform 37.2 and build tools
        run: sdkmanager "platforms;android-37.2" "build-tools;37.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build debug APK (trial build, v0.0.1)
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Verify C++ core
        run: ./scripts/test-cpp.sh

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Rename APK with version
        run: |
          VERSION="${{ github.ref_name }}"
          [ -n "${{ inputs.tag }}" ] && VERSION="${{ inputs.tag }}"
          cp app/build/outputs/apk/debug/app-debug.apk "farmsteq-global-${VERSION}.apk"
          sha256sum "farmsteq-global-${VERSION}.apk" > "farmsteq-global-${VERSION}.apk.sha256"

      - name: Create GitHub Release with APK and checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.ref_name }}"
          [ -n "${{ inputs.tag }}" ] && VERSION="${{ inputs.tag }}"
          NOTES="Farmerssteq Global ${VERSION} — native Android Average Lovable Product (debug-signed trial build)."
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "farmsteq-global-${VERSION}.apk" "farmsteq-global-${VERSION}.apk.sha256" --clobber
          else
            gh release create "$VERSION" "farmsteq-global-${VERSION}.apk" "farmsteq-global-${VERSION}.apk.sha256" --title "Farmerssteq Global ${VERSION}" --notes "$NOTES"
          fi
